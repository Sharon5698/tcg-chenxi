<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      color: #51323b;
      background: #fff0f2;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 24px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid rgba(81, 50, 59, 0.2);
      background: rgba(255, 240, 242, 0.96);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
    }

    nav a {
      color: #51323b;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #956875;
    }

    /* 第一页：首页 */
    .hero {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      padding: 70px 7%;
      background:
        linear-gradient(
          90deg,
          rgba(255, 240, 242, 0.08) 0%,
          rgba(255, 240, 242, 0.02) 100%
        ),
        url("./主页background.png.png") center center / cover no-repeat;
    }

    .hero-content {
      width: 50%;
      max-width: 720px;
      text-align: left;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(48px, 6vw, 92px);
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: 2px;
      color: #51323b;
    }

    .identity {
      margin: 0 0 14px;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: bold;
    }

    .time {
      margin: 0 0 24px;
      font-size: 18px;
      color: #956875;
    }

    .intro {
      margin: 0 0 32px;
      font-size: 18px;
      line-height: 1.8;
    }

    .douyin-button {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 6px;
      background: #754455;
      color: white;
      text-decoration: none;
      font-size: 18px;
      transition: background 0.2s ease;
    }

    .douyin-button:hover {
      background: #5e3545;
    }

    /* 第二页：关于 T.晨曦 */
    .about-page {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 60px 7%;
      background-image: url("./page2background.png.png?v=2");
      background-position: center center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-color: #fff8f1;
    }

    .about-content {
      width: 56%;
      max-width: 850px;
      padding: 28px 0 28px 30px;
      color: #51323b;
    }

    .about-content h2 {
      margin: 0 0 22px;
      font-size: clamp(30px, 3.5vw, 48px);
      font-weight: 600;
      line-height: 1.3;
    }

    .about-quote {
      margin: 0 0 24px;
      color: #315879;
      font-size: clamp(18px, 2vw, 25px);
      font-weight: bold;
      line-height: 1.8;
    }

    .about-date {
      margin: 0 0 22px;
      font-size: 17px;
      line-height: 1.8;
    }

    .about-item {
      margin: 0 0 16px;
      font-size: 16px;
      line-height: 1.9;
    }

    .about-item strong {
      display: inline-block;
      margin-right: 8px;
      padding: 2px 12px;
      border-radius: 20px;
      background: rgba(184, 207, 225, 0.75);
      color: #315879;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      header {
        padding: 18px 5%;
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        gap: 16px;
      }

      nav a {
        font-size: 14px;
      }

      .hero {
        min-height: 80vh;
        padding: 60px 7%;
        background-position: 60% center;
      }

      .hero-content {
        width: 100%;
        max-width: 100%;
      }

      h1 {
        font-size: clamp(40px, 10vw, 64px);
      }

      .intro {
        font-size: 16px;
      }

      .about-page {
        min-height: 100vh;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 7%;
        background-position: center top;
        background-size: auto 100%;
      }

      .about-content {
        width: 100%;
        max-width: 600px;
        margin-top: 45vh;
        border-radius: 16px;
        background: rgba(255, 248, 241, 0.88);
        padding: 24px;
      }

      .about-content h2 {

      }

      .about-quote {

      }

      .about-item,
      .about-date {
        font-size: 15px;
      }
    }
  </style>
</head>
